# Jumlah pekerja Apache — DIPERKECIL JAUH dari bawaannya.
#
# `mpm_prefork` bawaan Debian memasang MaxRequestWorkers 150. Tiap pekerja
# adalah satu proses PHP utuh; pada paket gratis Render yang hanya 512 MB,
# angka itu akan membuat kernel membunuh container jauh sebelum pekerjanya
# terpakai semua — dan matinya tanpa pesan yang menjelaskan apa-apa.
#
# Delapan pekerja: dengan ±40 MB per proses PHP, itu ±320 MB pada puncaknya,
# menyisakan ruang untuk Apache sendiri dan lonjakan memori saat impor. Delapan
# juga sudah jauh melampaui kebutuhan sebenarnya — yang dikejar di sini bukan
# banyaknya pengguna serentak, melainkan agar SATU permintaan panjang tidak
# lagi memblokir permintaan lain, termasuk health check.
#
# MaxConnectionsPerChild membuat tiap pekerja pensiun setelah 500 permintaan:
# kebocoran memori sekecil apa pun jadi tak sempat menumpuk sepanjang umur
# container yang bisa berhari-hari.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        8
    MaxConnectionsPerChild   500
</IfModule>
