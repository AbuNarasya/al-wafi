# Situs Al Wafi di dalam container.
#
# Menggantikan `php artisan serve`, yang melayani SATU permintaan pada satu
# waktu. Dengan server bawaan itu, satu impor panjang membekukan seluruh
# aplikasi — termasuk health check Render, yang lalu menyimpulkan service-nya
# mati dan merestart container di tengah pekerjaan. Itulah asal 502/503 yang
# muncul padahal datanya sudah tersimpan.
#
# `<VirtualHost *:*>` SENGAJA memakai wildcard port: Render menyuntikkan $PORT
# saat runtime, sedangkan konfigurasi Apache tak mengenal variabel lingkungan.
# Dengan wildcard, satu-satunya tempat yang perlu disentuh start.sh adalah baris
# `Listen` di ports.conf.

ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:*>
    DocumentRoot /app/public

    <Directory /app/public>
        # Laravel sudah membawa public/.htaccess sendiri — AllowOverride inilah
        # yang membuatnya dibaca. Tanpa ini seluruh rute selain "/" jadi 404.
        AllowOverride All
        Require all granted
        Options -MultiViews -Indexes
    </Directory>

    # Berkas di storage TIDAK boleh terjangkau dari luar. DocumentRoot memang
    # sudah menutupnya, tapi penjagaan berlapis lebih murah daripada menemukan
    # bukti pembayaran santri terbuka di internet.
    <DirectoryMatch "^/app/(?!public)">
        Require all denied
    </DirectoryMatch>

    # Ke stdout/stderr, bukan ke berkas: paket gratis Render tak punya disk
    # permanen, jadi log yang ditulis ke /var/log hilang tiap restart dan tak
    # pernah terbaca di panelnya.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
