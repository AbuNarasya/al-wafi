# Blueprint Render — deploy uji coba paket gratis.
#
# Pakai lewat Render → New → Blueprint, arahkan ke repo ini.
#
# DATABASE MEMAKAI NEON, bukan PostgreSQL bawaan Render. Alasannya: database
# gratis Render berumur terbatas lalu DIHAPUS, sedangkan Neon bertahan. Region
# service sengaja dipatok "ohio" agar sedekat mungkin dengan Neon di us-east-1 —
# satu halaman Laravel memanggil database belasan kali, jadi jarak antar-keduanya
# jauh lebih menentukan daripada jarak pengguna ke server.
#
# BATAS PAKET GRATIS yang melekat:
#   • service TIDUR setelah 15 menit menganggur (akses berikutnya ± 1 menit)
#   • TIDAK ada disk permanen → bukti pembayaran & berkas santri hilang saat
#     restart/deploy ulang (data di database tetap aman karena ada di Neon)
#   • TIDAK ada cron/worker → reminder tagihan harian tak berjalan otomatis
#     (tombol "Kirim Reminder Sekarang" tetap bisa dipakai manual)

services:
  - type: web
    name: alwafi
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /up
    envVars:
      # Ditanyakan Render saat blueprint dijalankan (tidak disimpan di repo).
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_PASSWORD
        sync: false

      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Log ke stderr agar terbaca di panel Render; storage/logs tidak persisten.
      - key: LOG_CHANNEL
        value: stderr

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-blue-cloud-aur0k9mn.c-10.us-east-1.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      # Neon menolak koneksi tanpa SSL.
      - key: DB_SSLMODE
        value: require

      # Sesi, cache, dan antrean memakai database — aman tanpa disk permanen.
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # Mengisi data awal + pengguna admin tiap kali container menyala.
      #
      # "false" SEJAK 31 Jul 2026, dan nilainya diubah DI BERKAS INI — bukan cuma
      # di dashboard. Env ber-`value` literal dikelola blueprint, jadi suntingan
      # lewat dashboard akan dikembalikan begitu blueprint di-sync ulang.
      #
      # Dua sebab:
      #  • Database produksi kini berisi master yang diisi manual (jenjang, tipe &
      #    jenis biaya, grid tarif 171 sel, potongan gelombang). Seeder hanya tahu
      #    data awal, dan menjalankannya tiap container menyala hanya menambahkan
      #    lagi jalur bawaan serta MENGEMBALIKAN password admin ke bawaannya.
      #  • Seeder pernah MENGGAGALKAN DEPLOY (29 Jul 2026): migrasi membuang kolom
      #    `jalur_pendaftaran.tahun_ajaran`, seeder versi lama masih mengisinya,
      #    container berhenti dengan "column does not exist". Seedernya sudah
      #    diperbaiki, tetapi gerbang ini membuat kejadian serupa tak fatal lagi.
      #
      # Setel "true" hanya saat memasang blueprint ini di database yang BENAR-BENAR
      # kosong — tanpa itu tak ada pengguna yang bisa login.
      - key: SEED_ON_DEPLOY
        value: "false"
